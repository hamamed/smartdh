name: Build Android APK

# Builds a signed Trusted Web Activity (TWA) APK from the live site and commits it
# into public/downloads/ so it ships to the VPS with the normal `git pull` deploy.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64  base64 of your kanzup-release.keystore  (scripts/make-keystore.*)
#   KEY_ALIAS                the key alias (e.g. kanzup)
#   KEY_STORE_PASSWORD       keystore password
#   KEY_PASSWORD             key password

on:
  workflow_dispatch:        # run manually from the Actions tab
  push:
    tags: ['v*']            # ...or by pushing a tag like v1.0.1

permissions:
  contents: write           # lets the job commit the APK back to the repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@latest

      - name: Point Bubblewrap at the runner's JDK + Android SDK
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_SDK_ROOT" > "$HOME/.bubblewrap/config.json"

      - name: Restore signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Set version from run number
        run: |
          node -e "const f='twa-manifest.json',m=require('./'+f);m.appVersionCode=${{ github.run_number }};m.appVersionName='1.0.'+${{ github.run_number }};require('fs').writeFileSync(f,JSON.stringify(m,null,2))"

      - name: Build signed APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Pipe passwords too, in case this Bubblewrap version prompts instead of reading env.
          printf '%s\n%s\n' "${{ secrets.KEY_STORE_PASSWORD }}" "${{ secrets.KEY_PASSWORD }}" \
            | bubblewrap build --skipPwaValidation

      - name: Generate Digital Asset Links
        run: |
          FP=$(keytool -list -v -keystore android.keystore -alias "${{ secrets.KEY_ALIAS }}" \
                 -storepass "${{ secrets.KEY_STORE_PASSWORD }}" | grep 'SHA256:' | awk '{print $2}')
          mkdir -p public/.well-known
          node -e "require('fs').writeFileSync('public/.well-known/assetlinks.json', JSON.stringify([{relation:['delegate_permission/common.handle_all_urls'],target:{namespace:'android_app',package_name:'com.kanzup.app',sha256_cert_fingerprints:['$FP']}}],null,2))"
          echo "Fingerprint: $FP"

      - name: Publish APK into the site
        run: |
          mkdir -p public/downloads
          cp app-release-signed.apk public/downloads/kanzup.apk
          git config user.name  "kanzup-build-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/downloads/kanzup.apk public/.well-known/assetlinks.json
          git commit -m "Build Android APK (run ${{ github.run_number }}) [skip ci]" || echo "nothing to commit"
          git push

      - name: Attach APK to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app-release-signed.apk
